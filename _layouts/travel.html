<!DOCTYPE html>
<html lang="{{ page.lang | default: 'et' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <style>
    /* Fonts and colours come from the Tactile theme; this only adds the ToC sidebar. */
    :root { --sidebar-width: 260px; }
    html { scroll-behavior: smooth; }

    /* kramdown renders {:toc} as ul#markdown-toc */
    #markdown-toc {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      overflow-y: auto;
      margin: 0;
      padding: 35px 20px;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.5);
      border-right: 1px solid #d5d5d5;
      font-size: 14px;
      line-height: 1.4;
    }
    #markdown-toc::before {
      content: "Sisukord";
      display: block;
      margin-bottom: 15px;
      font-weight: bold;
      color: #303030;
    }
    #markdown-toc ul {
      margin: 5px 0 10px;
      padding-left: 12px;
      border-left: 2px solid #d5d5d5;
    }
    #markdown-toc li {
      list-style: none;
      margin: 5px 0;
      padding-left: 0;
    }
    #markdown-toc > li > a { font-weight: bold; color: #303030; }
    #markdown-toc ul a { color: #6d6d6d; }
    #markdown-toc a:hover { color: #d5000d; }

    #container .inner { margin-left: calc(var(--sidebar-width) + 40px); }
    h2 { margin-top: 30px; }
    h2, h3 { scroll-margin-top: 15px; }

    @media (max-width: 1000px) {
      #markdown-toc {
        position: static;
        width: auto;
        height: auto;
        margin: 0 0 30px;
        border: 1px solid #d5d5d5;
      }
      #container .inner { width: 94%; max-width: 620px; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="inner">
      <header>
        <h1>{{ page.title }}</h1>
      </header>
      <section id="main_content">
        {{ content }}
      </section>
    </div>
  </div>
</body>
</html>
