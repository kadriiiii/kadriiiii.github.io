<!DOCTYPE html>
<html lang="{{ page.lang | default: 'et' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ page.title }}</title>
  <style>
    :root {
      --text: #222;
      --muted: #666;
      --bg: #fdfcf8;
      --sidebar-bg: #f3f0e8;
      --accent: #b5532a;
      --sidebar-width: 260px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.65;
      color: var(--text);
      background: var(--bg);
    }
    a { color: var(--accent); }

    /* kramdown renders {:toc} as ul#markdown-toc */
    #markdown-toc {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      overflow-y: auto;
      margin: 0;
      padding: 2rem 1.25rem;
      background: var(--sidebar-bg);
      border-right: 1px solid #e0dccf;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.85rem;
      line-height: 1.4;
      list-style: none;
    }
    #markdown-toc::before {
      content: "Sisukord";
      display: block;
      margin-bottom: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    #markdown-toc ul {
      list-style: none;
      margin: 0.3rem 0 0.8rem;
      padding-left: 0.9rem;
      border-left: 2px solid #e0dccf;
    }
    #markdown-toc li { margin: 0.3rem 0; }
    #markdown-toc > li > a { font-weight: 600; }
    #markdown-toc a { color: var(--text); text-decoration: none; }
    #markdown-toc a:hover { color: var(--accent); }

    main {
      max-width: 46rem;
      margin-left: calc(var(--sidebar-width) + 3rem);
      padding: 2rem 1.5rem 4rem;
    }
    h1 { font-size: 2.2rem; line-height: 1.2; margin-top: 0; }
    h2 { margin-top: 3rem; padding-bottom: 0.3rem; border-bottom: 1px solid #e0dccf; }
    h3 { margin-top: 2rem; }
    h2, h3 { scroll-margin-top: 1rem; }
    img { max-width: 100%; height: auto; }

    @media (max-width: 900px) {
      #markdown-toc {
        position: static;
        width: auto;
        height: auto;
        margin: 0 0 2rem;
        border-right: none;
        border-radius: 6px;
      }
      main { margin-left: 0; padding: 1.5rem 16px 3rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>{{ page.title }}</h1>
    {{ content }}
  </main>
</body>
</html>
