<!DOCTYPE html>
<html lang="{{ page.lang | default: 'et' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <style>
    /* Fonts and colours come from the Tactile theme; this only adds the ToC sidebar. */
    :root { --sidebar-width: 260px; }
    html { scroll-behavior: smooth; }

    /* kramdown renders {:toc} as ul#markdown-toc */
    #markdown-toc {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      overflow-y: auto;
      margin: 0;
      padding: 35px 20px;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.5);
      border-right: 1px solid #d5d5d5;
      font-size: 14px;
      line-height: 1.4;
    }
    #markdown-toc::before {
      content: "Sisukord";
      display: block;
      margin-bottom: 15px;
      font-weight: bold;
      color: #303030;
    }
    #markdown-toc ul {
      margin: 5px 0 10px;
      padding-left: 12px;
      border-left: 2px solid #d5d5d5;
    }
    #markdown-toc li {
      list-style: none;
      margin: 5px 0;
      padding-left: 0;
    }
    #markdown-toc > li > a { font-weight: bold; color: #303030; }
    #markdown-toc ul a { color: #6d6d6d; }
    #markdown-toc a:hover { color: #d5000d; }

    #container .inner { margin-left: calc(var(--sidebar-width) + 40px); }
    h2 { margin-top: 30px; }

    /* Images: fit the column, centred, with a soft shadow. */
    #container #main_content img {
      display: block;
      max-width: 85%;  /* ~530px; a bit narrower than the text */
      max-height: 80vh;
      width: auto;
      height: auto;
      margin: 25px auto 0;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
    /* Size modifiers, applied in markdown with {: .narrow} or {: .small} after the image. */
    #container #main_content img.narrow { max-width: 55%; }  /* ~340px; tall photos */
    #container #main_content img.small  { max-width: 65%; }  /* ~400px; small objects */
    /* Caption: an italic line written directly under the image in the same paragraph. */
    #main_content p > img + em {
      display: block;
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
      color: #6d6d6d;
    }
    h2, h3 { scroll-margin-top: 110px; }

    /* Keep the page title visible while scrolling; reuse the theme's body texture so text doesn't show through. */
    #container .inner > header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 15px 0;
      background: #e7e7e7 url({{ '/assets/images/body-bg.png' | relative_url }}) 0 0 repeat;
      border-bottom: 1px solid #d5d5d5;
    }

    @media (max-width: 1000px) {
      #markdown-toc {
        position: static;
        width: auto;
        height: auto;
        margin: 0 0 30px;
        border: 1px solid #d5d5d5;
      }
      #container .inner { width: 94%; max-width: 620px; margin: 0 auto; }
      #container .inner > header h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="inner">
      <header>
        <h1>{{ page.title }}</h1>
      </header>
      <section id="main_content">
        {{ content }}
      </section>
    </div>
  </div>
</body>
</html>
